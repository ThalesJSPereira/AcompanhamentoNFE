name: Monitor NFe Notas Técnicas

on:
  schedule:
    - cron: '0 9,21 * * *'   # 09h e 21h UTC = 06h e 18h em Brasília
  workflow_dispatch:

permissions:
  contents: write   # necessário para o bot commitar o histórico

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Executar monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python nfe_monitor.py

      - name: Commitar histórico atualizado
        run: |
          git config user.name "nfe-monitor-bot"
          git config user.email "bot@nfe-monitor.local"
          git add historico_nts.json
          git diff --staged --quiet || git commit -m "Atualiza histórico de NTs [skip ci]"
          git push
